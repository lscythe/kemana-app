name: Gradle setup
description: Install the mise toolchain and set up Gradle for Kemana builds
runs:
  using: composite
  steps:
    - name: Cache validated tool downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/mise/downloads-cas
        key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}
        restore-keys: |
          mise-downloads-${{ runner.os }}-
    - name: Install mise tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.4
        cache_key: mise-v1-{{platform}}-{{version}}-${{ hashFiles('mise.lock') }}
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
