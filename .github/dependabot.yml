version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
      compose:
        patterns:
          - org.jetbrains.compose*
          - androidx.compose*
